<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Passenger Search</title>

<link rel="stylesheet" href="/static/style.css">

</head>

<body>

<div class="container">

    <div class="header">
        <h2>🚆 Passenger Search</h2>
        <p>Search by Name, Mobile or PNR</p>
    </div>

    <div class="search-box">

        <input
            id="searchBox"
            type="text"
            placeholder="Enter Name / Mobile / PNR"
        >

        <button onclick="searchPassenger()">
            Search
        </button>

    </div>

    <div id="loading" class="loading">
        Searching...
    </div>

    <div id="result"></div>

</div>

<script src="/static/app.js"></script>

</body>
</html>
